spring.application.name=Prueba_Tecnica

# --- Reactive DB (R2DBC) ---
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/bank_db}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:postgres}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:postgres}

server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.example.Prueba_Tecnica=DEBUG

# OpenAPI / Swagger (WebFlux)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.version=1.0.0
springdoc.packages-to-scan=com.example.Prueba_Tecnica

spring.jackson.deserialization.read-enums-using-to-string=false
spring.jackson.serialization.write-enums-using-to-string=false
